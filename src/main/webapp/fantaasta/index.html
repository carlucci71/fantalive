<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FantaAsta">
  <meta name="theme-color" content="#0c1018">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<title>FantaAsta</title>
  <script>
    (function () {
      var VP = 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover';
      try {
        var q = new URLSearchParams(location.search);
        var flag = q.get('mobile');
        if (flag === '1') localStorage.setItem('fantaasta-force-mobile', '1');
        if (flag === '0') localStorage.removeItem('fantaasta-force-mobile');
        if (flag === '1' || localStorage.getItem('fantaasta-force-mobile') === '1') {
          document.documentElement.classList.add('fa-force-mobile');
        }
      } catch (e) {}
      // Telefono: preferisci portrait (overlay + lock API se disponibile)
      try {
        var tryLockPortrait = function () {
          try {
            if (screen.orientation && typeof screen.orientation.lock === 'function') {
              var p = screen.orientation.lock('portrait');
              if (p && typeof p.catch === 'function') p.catch(function () {});
            }
          } catch (el) {}
        };
        var syncOrient = function () {
          var w = window.innerWidth || 0;
          var h = window.innerHeight || 0;
          try {
            if (window.visualViewport && window.visualViewport.width) {
              w = Math.round(window.visualViewport.width) || w;
              h = Math.round(window.visualViewport.height) || h;
            }
          } catch (ev) {}
          var land = w > h || Math.abs(window.orientation || 0) === 90;
          var phoneLike = document.documentElement.classList.contains('fa-force-mobile')
            || Math.min(w, h) < 520
            || w < 900;
          document.documentElement.classList.toggle('fa-ui-landscape', land);
          document.documentElement.classList.toggle('fa-ui-portrait', !land);
          document.documentElement.classList.toggle('fa-ui-mobile-land', !!(land && phoneLike));
          document.documentElement.style.setProperty('--fa-vw', w + 'px');
          document.documentElement.style.setProperty('--fa-vh', h + 'px');
          var meta = document.querySelector('meta[name="viewport"]');
          if (meta) meta.setAttribute('content', VP);
          if (phoneLike) tryLockPortrait();
        };
        syncOrient();
        window.addEventListener('resize', syncOrient);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', syncOrient);
        }
        window.addEventListener('orientationchange', function () {
          setTimeout(syncOrient, 0);
          setTimeout(syncOrient, 100);
          setTimeout(syncOrient, 350);
        });
        document.addEventListener('fullscreenchange', tryLockPortrait);
      } catch (e2) {}
    })();
  </script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="./fantaasta-ui.css?v=20250925ui178">
  <link rel="stylesheet" href="./stile.css?v=20250925ui">
<script src="//ajax.googleapis.com/ajax/libs/angularjs/1.6.1/angular.js"></script>
<script src="//ajax.googleapis.com/ajax/libs/angularjs/1.6.1/angular-resource.js"></script>
<script src="//ajax.googleapis.com/ajax/libs/angularjs/1.6.1/angular-animate.js"></script>
<script src="//ajax.googleapis.com/ajax/libs/angularjs/1.6.1/angular-sanitize.js"></script>
<script src="//angular-ui.github.io/bootstrap/ui-bootstrap-tpls-2.5.0.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-i18n/1.6.1/angular-locale_it-it.min.js"></script>
  <script src="./ws-connection.js?v=20250925ui"></script>
  <script src="./app.js?v=20250925ui178"></script>
  <script src="./fa-ui.js?v=20250925ui178"></script>
</head>
<body class="fa-app" ng-app="app">

  <!-- Telefono in landscape: chiedi di ruotare (i browser non bloccano l'orientamento come le app) -->
  <div class="fa-rotate-lock" role="dialog" aria-modal="true" aria-label="Ruota il telefono in verticale">
    <div class="fa-rotate-lock__card">
      <div class="fa-rotate-lock__phone" aria-hidden="true"></div>
      <p class="fa-rotate-lock__title">Solo verticale</p>
      <p class="fa-rotate-lock__text">Ruota il telefono in portrait per continuare.</p>
    </div>
  </div>

  <input class="fa-hidden-legacy" type="button" value="" ng-click="changeVisFvm()">

  <div ng-controller="ModalDemoCtrl as pc" class="modal-demo"></div>

  <header class="fa-toolbar">
    <div class="fa-toolbar__brand" title="{{nomeLega || 'FantaAsta'}}">{{nomeLega || 'FantaAsta'}}</div>
    <span class="fa-toolbar__status" ng-class="{'is-live': isAstaLive()}" ng-show="nomegiocatore && !needsWizard() && !showLoginScreen()">{{faseAstaLabel()}}</span>
    <div class="fa-toolbar__spacer"></div>
    <div class="fa-user-menu" ng-show="nomeUtenteAttivo()">
      <button type="button" class="fa-avatar-btn" ng-class="{'is-open': userMenuOpen}" ng-click="toggleUserMenu($event)" aria-haspopup="true" aria-expanded="{{userMenuOpen}}">
        <span class="fa-avatar-btn__dot">{{nomeUtenteAttivo().substring(0,2).toUpperCase()}}</span>
        <span class="fa-avatar-btn__name" title="{{nomeUtenteAttivo()}}">{{nomeUtenteAttivo()}}</span>
        <span class="fa-user-menu__chevron" aria-hidden="true">▾</span>
      </button>
      <div class="fa-user-menu__dropdown" ng-show="userMenuOpen" ng-click="$event.stopPropagation()">
        <button type="button" class="fa-user-menu__item" ng-show="isAdmin" ng-click="userMenuOpzioni()">Opzioni</button>
        <button type="button" class="fa-user-menu__item" ng-show="isAdmin" ng-click="userMenuEsporta()">Esporta Rose</button>
        <button type="button" class="fa-user-menu__item" ng-show="isAdmin" ng-click="userMenuLogoutTutti()">Annulla sessione</button>
        <button type="button" class="fa-user-menu__item fa-user-menu__item--danger" ng-click="userMenuLogout()">Logout</button>
 	</div>
    </div>
  </header>

  <!-- Su login il messaggio resta solo nella card (vedi login-screen) -->
  <div class="fa-alert" ng-show="connessioneKO && !showLoginScreen()">{{connessioneKO}}</div>

  <!-- Login (sempre primo passo se non connesso) -->
  <div ng-if="showLoginScreen()" ng-include="'./partials/login-screen.html?v=20250925ui178'"></div>

  <!-- Wizard / setup admin -->
  <div ng-if="needsWizard()" ng-include="'./partials/wizard.html?v=20250925ui178'"></div>

  <!-- Main board (scrollport landscape = layout PC) -->
  <div class="fa-board-scroll" ng-if="!needsWizard() && !showLoginScreen() && nomegiocatore">
  <div class="fa-board">

    <div class="fa-board__main">
      <div class="fa-tab-pane fa-tab-pane--auction" ng-class="{'is-active': uiTab === 'asta'}"
           ng-include="'./partials/auction-panel.html?v=20250925ui178'"></div>
      <div class="fa-tab-pane fa-tab-pane--players" ng-class="{'is-active': uiTab === 'players'}"
           ng-include="'./partials/player-sidebar.html?v=20250925ui178'"></div>
				</div>
				
    <div class="fa-board__teams-host" ng-include="'./partials/team-strip.html?v=20250925ui178'"></div>
    <div class="fa-board__ops-host" ng-include="'./partials/ops-panel.html?v=20250925ui178'"></div>
			</div>
  </div>

  <div ng-include="'./partials/taglia-modal.html?v=20250925ui178'"></div>

  <!-- Mobile tab bar (solo portrait) -->
  <nav class="fa-tab-bar fa-mobile-only" ng-show="!needsWizard() && !showLoginScreen() && isMobilePortraitUi()">
    <button type="button" class="fa-tab-bar__item" ng-class="{'is-active': uiTab==='asta', 'has-live': faseAsta==='BIDDING'}" ng-click="setUiTab('asta')">
      <span style="font-size:1.2rem">⚖</span>
      <span>Asta</span>
    </button>
    <button type="button" class="fa-tab-bar__item" ng-class="{'is-active': uiTab==='teams', 'has-new': haAcquistoRecenteBadge}" ng-click="setUiTab('teams')">
      <span style="font-size:1.2rem">👥</span>
      <span>Squadre</span>
    </button>
    <button type="button" class="fa-tab-bar__item" ng-class="{'is-active': uiTab==='players'}" ng-click="setUiTab('players')">
      <span style="font-size:1.2rem">📋</span>
      <span>Giocatori</span>
    </button>
    <button type="button" class="fa-tab-bar__item" ng-class="{'is-active': uiTab==='ops'}" ng-click="setUiTab('ops')">
      <span style="font-size:1.2rem">📊</span>
      <span>Operazioni</span>
    </button>
  </nav>

  <!-- Hidden legacy connect table for admin opera come / edge cases -->
  <div class="fa-hidden-legacy">
    <img ng-show="!nomegiocatore && utenti.indexOf(utente.nome)==-1" title="connetti" src="./disconnect-icon.png" ng-click="callDoConnect(utente.nome, utente.id, utente.pwd)" ng-repeat="utente in elencoAllenatori"/>
    <img title="avvia asta" src="./startGiocatore.png" ng-click="inizia(utente.nome, utente.id)" ng-repeat="utente in elencoAllenatori"/>
    <img ng-click="openChangeLog()" title="ChangeLog Asta" src="./changelog.jpeg"/>
				</div>

</body>
</html>
